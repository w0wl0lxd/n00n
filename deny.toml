[advisories]
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2024-0320", reason = "transitive via syntect; no safe upgrade until syntect migrates to yaml-rust2" },
  { id = "RUSTSEC-2025-0141", reason = "transitive via syntect; bincode 1.x is the final release and not a vulnerability" },
  { id = "RUSTSEC-2023-0089", reason = "transitive via monty -> postcard -> heapless 0.7; upstream is not yet on heapless 0.8+" },
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-3-Clause-Clear",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "CC0-1.0",
  "CC-BY-4.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
  "Artistic-2.0",
  "AGPL-3.0",
  "GPL-2.0",
  "GPL-3.0",
  "LGPL-2.1",
  "LGPL-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/pydantic/monty.git",
  "https://github.com/samuelcolvin/ruff.git",
]
