name: Markdownlint

on:
  push:
    branches: ["main"]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - ".github/workflows/markdownlint.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - ".github/workflows/markdownlint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262'  # v4
        with:
          persist-credentials: false

      - uses: 'jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea'  # v4.2.1
        with:
          install_args: 'npm:markdownlint-cli2'

      - name: Lint Markdown files
        run: |
          markdownlint-cli2 "*.md" "site/**/*.md" "crates/**/*.md"
