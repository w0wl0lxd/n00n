name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/stale@5bef64f19d7facfb25b37b414482c7164d639639'  # v9
        with:
          stale-issue-message: >
            This issue is stale because it has been open 60 days with no
            activity. Remove the stale label or comment to keep it open.
          stale-pr-message: >
            This PR is stale because it has been open 60 days with no activity.
            Remove the stale label or comment to keep it open.
          close-issue-message: >
            This issue was closed because it has been stale for 7 days.
          close-pr-message: >
            This PR was closed because it has been stale for 7 days.
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
