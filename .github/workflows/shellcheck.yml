name: Shellcheck

on:
  push:
    branches: ["main"]
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262'  # v4
        with:
          persist-credentials: false

      - uses: 'jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea'  # v4.2.1
        with:
          install_args: shellcheck

      - name: Run shellcheck
        run: |
          find . -type f -name '*.sh' \
            -not -path './.git/*' \
            -not -path './.specify/*' \
            -not -path './target/*' \
            -not -path './.venv/*' \
            -not -path './.tools/*' \
            -not -path './result/*' \
            -print0 |
            xargs -0 shellcheck --severity=warning -s bash -x
