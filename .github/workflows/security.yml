name: Security
on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/security.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # rustsec/audit-check reports through the Checks API on push, PR and manual
  # runs, and opens issues only on scheduled runs. Each job gets only the
  # write scope its event needs; the workflow-level `contents: read` leaves
  # both at none, so the report step would fail with a 403.
  audit:
    name: cargo-audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  audit-scheduled:
    name: cargo-audit (scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: cargo-binstall cargo:cargo-deny
      - run: cargo deny --workspace check licenses bans sources
