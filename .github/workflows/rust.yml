name: Rust
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706'  # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - "Cargo.toml"
              - "Cargo.lock"
              - "src/**"
              - "n00n-*/src/**"
              - "n00n-*/tests/**"
              - "n00n-*/benches/**"
              - "n00n-*/baselines/**"
              - "n00n-*/examples/**"
              - "plugins/**"
              - "justfile"
              - "rust-toolchain.toml"
              - "clippy.toml"
              - "deny.toml"
              - "codecov.yml"
              - ".github/workflows/rust.yml"
              - ".github/workflows/security.yml"
  fmt:
    name: Format (Rust)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
  fmt-lua:
    name: Format (Lua)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: stylua
      - run: stylua --check plugins/
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'linux-stable'
          save-if: true
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: just
      - run: just build
  lint:
    name: Lint
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'linux-stable'
          save-if: false
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: just
      - run: just lint
  test:
    name: Test
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'linux-stable'
          save-if: false
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: just
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: nextest
      - run: just test
  machete:
    name: Unused deps
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'linux-stable'
          save-if: false
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: cargo-machete
      - run: cargo machete
  docs:
    name: Docs
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'linux-stable'
          save-if: false
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: just
      - run: just gen-docs-check
  build-windows:
    name: Build (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'windows-stable'
          save-if: true
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: just
      - run: just build
  lint-windows:
    name: Lint (Windows)
    needs: [changes, build-windows]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'windows-stable'
          save-if: false
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: just
      - run: just lint
  build-macos:
    name: Build (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'macos-stable'
          save-if: true
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: just
      - run: just build
  lint-macos:
    name: Lint (macOS)
    needs: [changes, build-macos]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'macos-stable'
          save-if: false
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: just
      - run: just lint
  test-macos:
    name: Test (macOS)
    needs: [changes, build-macos]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'macos-stable'
          save-if: false
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: just
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: nextest
      - run: just test
  test-windows:
    name: Test (Windows)
    needs: [changes, build-windows]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'windows-stable'
          save-if: false
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: just
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: nextest
      - run: just test
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772'  # master
        with:
          toolchain: nightly-2026-08-20
          components: llvm-tools-preview
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'linux-coverage'
          save-if: true
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: nextest
      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: cargo-llvm-cov
      # `--failure-mode all` so one unreadable profraw does not fail the whole
      # job. Tests that kill a child process leave a truncated file in the
      # merge pool, and llvm-profdata's default `any` mode then discards a run
      # whose tests all passed. `Coverage` gates the required `CI` check, so
      # that flake blocks every merge.
      - run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info --retries 2 --failure-mode all
      - uses: 'codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac'  # v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  rustdoc:
    name: Rustdoc
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'  # v7
        with:
          persist-credentials: false
      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: 'linux-stable'
          save-if: false
      - run: cargo doc --workspace --no-deps
  ci-pass:
    name: CI
    if: always()
    needs:
      - fmt
      - fmt-lua
      - build
      - lint
      - test
      - machete
      - docs
      - build-windows
      - lint-windows
      - test-windows
      - build-macos
      - lint-macos
      - test-macos
      - coverage
      - rustdoc
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
