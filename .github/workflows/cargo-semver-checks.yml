name: Cargo semver checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "src/**"
      - ".github/workflows/cargo-semver-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    # cargo-semver-checks currently fails on the gix dependency tree because
    # gix-protocol 0.64.0 depends on a yanked bisync release. It is kept as a
    # non-blocking check until that upstream situation is resolved.
    continue-on-error: true
    steps:
      - uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262'  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: 'dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772'  # master
        with:
          toolchain: nightly-2026-08-20

      - uses: 'Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32'  # v2
        with:
          shared-key: "linux-semver"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: 'taiki-e/install-action@a7e592b24782184db1613493a5e65d2e12199f80'  # v2.69.4
        with:
          tool: cargo-semver-checks

      - name: Check semver
        env:
          BASE_REF: ${{ github.base_ref }}
        # Excluding crates that transitively depend on gix, to avoid the yanked
        # bisync release used by gix-protocol 0.64.0.
        run: |
          cargo semver-checks --workspace \
            --exclude n00n-git \
            --exclude n00n-lua \
            --exclude n00n-ui \
            --baseline-rev "origin/${BASE_REF}"
