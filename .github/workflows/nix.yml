name: Nix

on:
  push:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**.nix"
      - ".github/workflows/nix.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**.nix"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262'  # v4
        with:
          persist-credentials: false

      - uses: 'DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25'  # v22

      - uses: 'DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d'  # v14
        with:
          use-flakehub: false

      - uses: 'DeterminateSystems/flake-checker-action@078f5f7f47ee188aa6cb472527ca5984e195222d'  # v9

      - name: Check Nix formatting
        run: |
          system=$(nix eval --impure --expr 'builtins.currentSystem' | tr -d '"')
          find . -type f -name '*.nix' -not -path './.git/*' -print0 |
            xargs -0 nix run ".#formatter.${system}" -- --check

      - name: Run statix
        run: nix run nixpkgs#statix -- check .

      - name: Run deadnix
        run: nix run nixpkgs#deadnix -- .

      - name: Check flake
        run: nix flake check
