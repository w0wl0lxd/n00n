title = "n00n gitleaks configuration"

# Use the built-in gitleaks ruleset as a base, then layer repo-specific
# allowlists on top.
[extend]
useDefault = true

[[allowlists]]
description = "Known false positives in removed subprojects"
condition = "AND"
paths = ['''maki-agent/''', '''maki-providers/''']
regexes = [
  # Feature/version date identifiers, e.g. "oauth-2025-04-20" or
  # "interleaved-thinking-2025-05-14". Not credentials.
  '''(oauth|interleaved-thinking)-\d{4}-\d{2}-\d{2}''',
]

[[allowlists]]
description = "Known HS256 JWT test fixtures"
condition = "AND"
paths = ['''n00n-redact/src/lib\.rs''']
regexes = [
  '''eyJhbGciOiJIUzI1Ni''',
  '''AIzaSyD0123456789abcdefghijklmnopqrstuv''',
]
